today_pending:
  title: 企画書を開く
  description: 最初の見出しだけ書く
  status: pending
  scheduled_date: <%= Date.current %>
  estimated_minutes: 5

today_active:
  title: メールを一通返す
  status: active
  scheduled_date: <%= Date.current %>
  estimated_minutes: 10

completed:
  title: 昨日の振り返り
  status: completed
  scheduled_date: <%= Date.current - 1.day %>
  completed_at: <%= Time.current %>
